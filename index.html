<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Rustwake</title>
<meta name="description" content="You start with one rusty ship. Mine, explore a procedurally generated galaxy, colonise worlds, build fleets and megastructures, and try not to be noticed by the thing that is removing the stars.">
<link rel="preload" href="fonts/DMMono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304050a'/%3E%3Ccircle cx='11' cy='20' r='6' fill='%23ffb86a'/%3E%3Cpath d='M17 15l9-8-3 9z' fill='%239fd8ff'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="topbar"><div id="loc"></div><div id="resbar"></div><div id="civ"></div></div>
  <div id="alert"></div>
  <div id="mission" data-a="mtoggle"></div>
  <div id="shipbox"></div>
  <div id="toasts"></div>
  <div id="prompt" data-a="interact"></div>
  <div id="nav"></div>
  <canvas id="mini" width="180" height="180"></canvas>
  <button id="navbtn" class="b" data-a="navtoggle">☰ MENU</button>
  <div id="touch">
    <div id="stick"><i id="knob"></i></div>
    <button class="tb" id="tmine" data-hold=" ">MINE</button>
    <button class="tb" id="tboost" data-hold="Shift">BOOST</button>
    <button class="tb" id="tnova" data-a="nova">NOVA</button>
  </div>
</div>

<div id="mapwrap">
  <canvas id="map"></canvas>
  <div id="mapinfo"></div>
  <button class="b close xbtn" data-a="mapclose">✕ close map</button>
  <div class="mzoom"><button class="b" data-a="mz" data-d="1">+</button><button class="b" data-a="mz" data-d="0">−</button></div>
</div>

<div id="panel">
  <div class="phead"><button class="b back" id="pback" data-a="back">◂ Back</button><h2 id="ptitle"></h2><button class="b close" data-a="close">✕</button></div>
  <div id="pbody"></div>
</div>

<div id="dialog"><div id="dbody"></div></div>

<div id="title">
  <h1>RUSTWAKE</h1>
  <div class="tag">ONE RUSTY SHIP · ONE GALAXY · NO END</div>
  <div class="row" id="titlebtns"></div>
  <div class="row"><input id="seed" placeholder="universe seed (optional)" maxlength="12"></div>
  <p class="fine">Mine. Explore. Colonise. Automate. Survive. The galaxy is generated from a seed and saved in this browser; there is no server. Plays with keyboard and mouse, or on a phone or tablet with touch controls (landscape is roomier).</p>
</div>

<script src="js/util.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/universe.js?v=3"></script>
<script src="js/econ.js?v=3"></script>
<script src="js/empire.js?v=3"></script>
<script src="js/events.js?v=3"></script>
<script src="js/flight.js?v=3"></script>
<script src="js/render.js?v=3"></script>
<script src="js/galaxy.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
